<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">NEXGEAR media placeholder</title>
  <desc id="desc">Dark geometric placeholder used when a product or article image cannot be loaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="52%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <rect width="960" height="640" fill="url(#glow)"/>
  <g transform="translate(480 290)" fill="none" stroke="#00e5ff">
    <path d="M-112-52 0-116l112 64v104L0 116l-112-64Z" stroke-opacity=".55" stroke-width="3"/>
    <path d="M-58-20 0-54l58 34v40L0 54l-58-34Z" stroke-width="5"/>
    <path d="M0-54v108M-58-20 0 14l58-34" stroke-opacity=".5" stroke-width="3"/>
  </g>
  <text x="480" y="460" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="8">NEXGEAR</text>
  <text x="480" y="500" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" letter-spacing="3">MEDIA UNAVAILABLE</text>
</svg>
