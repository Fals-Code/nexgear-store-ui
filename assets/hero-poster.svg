<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">NEXGEAR premium gaming setup</title>
  <desc id="desc">Dark futuristic poster with cyan geometric details used before the homepage hero video loads.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060d"/>
      <stop offset="0.55" stop-color="#071421"/>
      <stop offset="1" stop-color="#0a2031"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="45%" r="48%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0v64" fill="none" stroke="#7dd3fc" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g opacity="0.32" stroke="#00e5ff" fill="none">
    <path d="M-80 900 650 0M180 900 910 0M440 900 1170 0M700 900 1430 0M960 900 1690 0"/>
  </g>

  <g transform="translate(1160 425)" fill="none" stroke="#00e5ff">
    <path d="M0-240 208-120v240L0 240-208 120v-240Z" stroke-width="6" stroke-opacity="0.68"/>
    <path d="M0-142 123-71v142L0 142-123 71V-71Z" stroke-width="4"/>
    <path d="M0-142V142M-123-71 0 0l123-71" stroke-width="3" stroke-opacity="0.55"/>
    <circle r="305" stroke-width="2" stroke-dasharray="10 18" stroke-opacity="0.25"/>
  </g>

  <rect x="120" y="286" width="6" height="260" rx="3" fill="url(#beam)"/>
  <text x="166" y="365" fill="#f8fafc" font-family="Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="10">NEXGEAR</text>
  <text x="172" y="440" fill="#00e5ff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="7">DOMINASI SETIAP FRAME</text>
  <text x="172" y="500" fill="#a8b5c8" font-family="Arial, sans-serif" font-size="25" letter-spacing="2">PREMIUM GAMING GEAR INTERFACE</text>

  <g transform="translate(172 560)">
    <rect width="330" height="66" rx="14" fill="#07111f" stroke="#00e5ff" stroke-opacity="0.6"/>
    <text x="165" y="42" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5">WORKSHOP UI</text>
  </g>
</svg>
