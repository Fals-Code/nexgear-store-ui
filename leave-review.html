<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulis Ulasan | NEXGEAR</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/leave-review.css">
</head>
<body class="page-review">
    <!-- GLOBAL HEADER COMPONENT -->
    <div id="global-header"></div>

  <main class="site-main">
    <div class="container section-padding">
      <div class="section-header text-center">
        <h2>Tulis Ulasan</h2>
        <p class="text-secondary">Bagikan pengalaman Anda tentang produk ini.</p>
      </div>

      <div class="review-container">
        
        <!-- PRODUCT SUMMARY -->
        <div class="review-product-card">
          <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Keyboard">
          <div class="rp-info">
            <span class="product-cat">Control</span>
            <h3>Vortex VX Pro Mechanical</h3>
            <p>Dibeli pada 05 Jun 2026</p>
          </div>
        </div>

        <!-- REVIEW FORM -->
        <form class="review-form" data-review-form>
          
          <div class="form-group text-center">
            <label>Beri Rating Bintang</label>
            <div class="rating-selector">
              <!-- Reversed for pure CSS hover trick, or handled via JS. We'll use simple icons for mockup -->
              <button type="button" class="star-btn active"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
              <button type="button" class="star-btn active"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
              <button type="button" class="star-btn active"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
              <button type="button" class="star-btn active"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
              <button type="button" class="star-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
            </div>
          </div>

          <div class="form-group">
            <label>Judul Ulasan</label>
            <input type="text" class="form-input" placeholder="Ringkasan kesan Anda (contoh: Switch sangat responsif!)" required>
          </div>

          <div class="form-group">
            <label>Detail Ulasan</label>
            <textarea class="form-input" rows="6" placeholder="Ceritakan pengalaman Anda menggunakan produk ini. Apa yang Anda suka atau tidak suka?" required></textarea>
          </div>

          <div class="form-group">
            <label>Unggah Foto Produk (Opsional)</label>
            <div class="upload-area">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>Klik atau seret foto ke area ini</span>
              <p class="text-secondary" style="font-size: 0.8rem; margin-top: 5px;">Maks. 3 foto (JPG, PNG), per foto maks 5MB.</p>
            </div>
            <!-- Dummy Preview -->
            <div class="upload-preview">
              <div class="preview-item">
                <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="Preview">
                <button type="button" class="remove-preview">x</button>
              </div>
            </div>
          </div>

          <div class="review-actions">
            <button type="submit" class="btn btn-primary w-100">Kirim Ulasan</button>
            <a href="product-detail.html" class="btn btn-outline w-100 text-center" style="margin-top: 15px;">Batal</a>
          </div>

        </form>

      </div>
    </div>
  </main>
            <!-- GLOBAL FOOTER COMPONENT -->
    <div id="global-footer"></div>

    <script src="scripts/global-components.js"></script>
    <script src="scripts/core/storage.js"></script>
    <script src="scripts/core/events.js"></script>
    <script src="scripts/core/currency.js"></script>
    <script src="scripts/components/toast.js"></script>
    <script src="scripts/core/cart.js"></script>
    <script src="scripts/core/auth.js"></script>
    <script src="scripts/components/dialog.js"></script>
    <script src="scripts/components/navigation.js"></script>
    <script src="scripts/pages/catalog.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
