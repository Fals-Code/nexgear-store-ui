<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - NEXGEAR</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      background:
        linear-gradient(180deg, rgba(92, 59, 34, 0.2) 0%, transparent 36%),
        radial-gradient(circle at 50% 0%, rgba(227, 173, 87, 0.15), transparent 38%),
        linear-gradient(180deg, var(--color-bg-richest) 0%, var(--color-bg-deepest) 56%, #050403 100%);
    }

    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(96px, 12vw, 170px) 20px;
      text-align: center;
    }

    .error-svg {
      width: min(560px, 78vw);
      height: 1px;
      margin-bottom: clamp(28px, 5vw, 54px);
      display: grid;
      place-items: center;
      border: 0;
      border-top: 1px solid rgba(255, 247, 235, 0.18);
      background: transparent;
      box-shadow: none;
    }

    .error-svg svg {
      display: none;
    }

    .error-code {
      margin: 0 0 clamp(18px, 3vw, 28px);
      color: var(--color-primary);
      font-family: var(--font-display), Georgia, serif;
      font-size: clamp(7rem, 28vw, 20rem);
      font-weight: 900;
      line-height: 0.78;
      letter-spacing: 0;
      text-shadow: none;
    }

    .error-text {
      max-width: 620px;
      margin: 0 0 clamp(34px, 5vw, 54px);
      color: rgba(255, 247, 235, 0.74);
      font-size: clamp(1.18rem, 2vw, 1.45rem);
      line-height: 1.72;
    }

    .error-container .btn {
      min-height: 58px;
      padding-inline: 30px;
      border: 1px solid var(--color-primary);
      border-radius: 999px;
      background: var(--color-primary);
      color: var(--color-bg-richest);
      font-family: var(--font-heading);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
      transition:
        transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .error-container .btn:hover {
      transform: translateY(-2px);
      background: var(--color-primary-light);
      filter: none;
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 520px) {
      .error-svg {
        width: 100%;
      }

      .error-code {
        font-size: clamp(6.4rem, 32vw, 9rem);
      }
    }
  </style>
  <style>
    body { opacity: 0; transition: opacity 0.25s ease; }
    body.loaded { opacity: 1; }
  </style>
  <noscript><style>body { opacity: 1; }</style></noscript>
</head>
<body>
  <div class="error-container">
    <div class="error-svg">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Broken Cable / Plug -->
        <path d="M40 160 Q 60 100, 100 120 T 150 50" stroke="rgba(255,255,255,0.2)" stroke-dasharray="5 5"/>
        <path d="M40 160 Q 60 100, 95 118" stroke="var(--primary)"/>
        <!-- Zap sparks -->
        <path d="M90 105 L 85 95 L 95 90" stroke="var(--warning)"/>
        <path d="M105 130 L 115 135 L 110 145" stroke="var(--warning)"/>
        
        <!-- Plug head -->
        <rect x="140" y="40" width="20" height="30" rx="2" stroke="var(--text-muted)"/>
        <line x1="145" y1="40" x2="145" y2="25" stroke="var(--text-muted)"/>
        <line x1="155" y1="40" x2="155" y2="25" stroke="var(--text-muted)"/>
        
        <!-- Confused face -->
        <circle cx="100" cy="180" r="10" stroke="var(--accent)"/>
        <line x1="97" y1="178" x2="97" y2="178" stroke-width="3" stroke="var(--accent)"/>
        <line x1="103" y1="178" x2="103" y2="178" stroke-width="3" stroke="var(--accent)"/>
        <path d="M97 184 Q 100 182, 103 184" stroke="var(--accent)"/>
      </svg>
    </div>
    
    <h1 class="error-code">404</h1>
    <p class="error-text">Halaman ini tampaknya sudah meninggalkan rak. Mari kembali ke tempat barang-barang bagus masih tersusun rapi.</p>
    
    <a href="catalog.html" class="btn btn-primary">Kembali ke Store</a>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
