<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - NEXGEAR</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body {
      background:
        radial-gradient(circle at 20% 12%, rgba(0, 212, 255, 0.12), transparent 30%),
        radial-gradient(circle at 80% 18%, rgba(255, 62, 162, 0.08), transparent 28%),
        linear-gradient(180deg, #0a0f18 0%, #070a10 60%, #080b10 100%);
    }

    .error-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .error-svg {
      width: 250px;
      height: 250px;
      margin-bottom: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 35%, rgba(0, 212, 255, 0.14), transparent 52%),
        rgba(15, 19, 30, 0.86);
      box-shadow: 0 24px 70px rgba(0,0,0,0.34);
    }

    .error-svg svg {
      width: 76%;
      height: 76%;
    }

    .error-code {
      font-family: "Orbitron", sans-serif;
      font-size: 6rem;
      font-weight: 900;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.18);
    }

    .error-text {
      max-width: 520px;
      font-size: 1.05rem;
      line-height: 1.7;
      color: rgba(224, 228, 240, 0.72);
      margin-bottom: 40px;
    }

    .error-container .btn {
      min-height: 48px;
      border-radius: 12px;
      box-shadow: 0 12px 34px rgba(0, 212, 255, 0.2);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .error-container .btn:hover {
      transform: translateY(-1px);
      filter: saturate(1.05);
      box-shadow: 0 16px 42px rgba(0, 212, 255, 0.28);
    }

    @media (max-width: 520px) {
      .error-svg {
        width: 210px;
        height: 210px;
      }

      .error-code {
        font-size: 4.5rem;
      }
    }
  </style>
  <style>
    body { opacity: 0; transition: opacity 0.25s ease; }
    body.loaded { opacity: 1; }
  </style>
  <noscript><style>body { opacity: 1; }</style></noscript>
</head>
<body>
  <div class="error-container">
    <div class="error-svg">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- Broken Cable / Plug -->
        <path d="M40 160 Q 60 100, 100 120 T 150 50" stroke="rgba(255,255,255,0.2)" stroke-dasharray="5 5"/>
        <path d="M40 160 Q 60 100, 95 118" stroke="var(--primary)"/>
        <!-- Zap sparks -->
        <path d="M90 105 L 85 95 L 95 90" stroke="var(--warning)"/>
        <path d="M105 130 L 115 135 L 110 145" stroke="var(--warning)"/>
        
        <!-- Plug head -->
        <rect x="140" y="40" width="20" height="30" rx="2" stroke="var(--text-muted)"/>
        <line x1="145" y1="40" x2="145" y2="25" stroke="var(--text-muted)"/>
        <line x1="155" y1="40" x2="155" y2="25" stroke="var(--text-muted)"/>
        
        <!-- Confused face -->
        <circle cx="100" cy="180" r="10" stroke="var(--accent)"/>
        <line x1="97" y1="178" x2="97" y2="178" stroke-width="3" stroke="var(--accent)"/>
        <line x1="103" y1="178" x2="103" y2="178" stroke-width="3" stroke="var(--accent)"/>
        <path d="M97 184 Q 100 182, 103 184" stroke="var(--accent)"/>
      </svg>
    </div>
    
    <h1 class="error-code">404</h1>
    <p class="error-text">Ups! Kabelnya putus... Halaman tidak ditemukan.</p>
    
    <a href="index.html" class="btn btn-primary">Kembali ke Base</a>
  </div>

  <script src="scripts/main.js"></script>
</body>
</html>
