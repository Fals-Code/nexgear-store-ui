<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daftar ke akun NEXGEAR untuk pengalaman belanja gaming gear yang lebih personal.">
  <title>Daftar | NEXGEAR</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <main class="login-wrapper">
    <a href="index.html" class="btn btn-outline" style="position: absolute; top: 32px; left: 32px; z-index: 10; font-size: 0.9rem; padding: 8px 16px;">
      <span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></span> Kembali
    </a>
    <div class="login-bg-deco">
      <svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
        <path d="M-50,100 Q150,50 350,150 T750,100 T1150,150" stroke="rgba(255,255,255,0.05)" fill="none" stroke-width="2" stroke-dasharray="10 5" />
        <path d="M-50,300 Q200,400 400,250 T800,350 T1200,250" stroke="rgba(0,210,255,0.05)" fill="none" stroke-width="2" stroke-dasharray="10 5" />
        <circle cx="10%" cy="20%" r="40" stroke="rgba(255,255,255,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" />
        <circle cx="85%" cy="80%" r="60" stroke="rgba(157,80,187,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" />
        <rect x="80%" y="15%" width="80" height="80" rx="10" stroke="rgba(0,210,255,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" transform="rotate(15 80% 15%)" />
      </svg>
    </div>

    <div class="login-card sketch-card tape-corner reveal">
      <div class="login-avatar">
        <span class="icon icon-xl">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="2 1"/>
            <path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 2"/>
            <circle cx="10" cy="7" r="1" fill="currentColor"/>
            <circle cx="14" cy="7" r="1" fill="currentColor"/>
            <path d="M10 10 Q12 11 14 10" stroke="currentColor" fill="none" stroke-width="1"/>
          </svg>
        </span>
      </div>
      <h2>Daftar Akun</h2>
      <div class="subtitle">buat akun NEXGEAR baru~</div>

      <form id="register-form" class="auth-form active">
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" class="notepad-input" placeholder="Nama Lengkap" required>
        </div>
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
          <input type="email" class="notepad-input" placeholder="Email" required>
        </div>
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="notepad-input" placeholder="Password" required>
        </div>
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="notepad-input" placeholder="Konfirmasi Password" required>
        </div>
        <div class="form-options">
          <label class="checkbox-label" style="font-size: 0.8rem;">
            <input type="checkbox" required> Saya setuju dengan syarat & ketentuan
          </label>
        </div>
        <button type="submit" class="btn btn-accent auth-btn">Daftar Sekarang</button>
        
        <div class="auth-divider" style="margin-top: 10px;">atau</div>
        
        <p style="font-size: 0.9rem; color: var(--text-muted);">
          Sudah punya akun? <a href="login.html" class="forgot-link">Masuk di sini</a>
        </p>
      </form>

    </div>
  </main>

  <script src="scripts/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (window.NexAuth) window.NexAuth.login();
      showToast('Akun berhasil dibuat! Mengalihkan ke beranda...');
      setTimeout(() => window.location.href = 'index.html', 1500);
    });
  </script>
</body>
</html>
