<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja | NEXGEAR</title>
  <link rel="stylesheet" href="styles/global.css">
  <link rel="stylesheet" href="styles/cart.css">
</head>
<body class="page-cart">
    <!-- GLOBAL HEADER COMPONENT -->
    <div id="global-header"></div>

  <main class="site-main">
    <div class="container section-padding">
      <div class="section-header">
        <h2>Keranjang Belanja</h2>
      </div>

      <div class="cart-layout">
        <!-- CART ITEMS -->
        <div class="cart-items">
          
          <div class="cart-item">
            <div class="cart-item-image">
              <img src="https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Keyboard">
            </div>
            <div class="cart-item-info">
              <span class="product-cat">Control</span>
              <a href="product-detail.html"><h3>Vortex VX Pro Mechanical</h3></a>
              <p>Linear Red Switch</p>
              <div class="cart-item-actions">
                <div class="quantity-selector">
                  <button class="qty-btn">-</button>
                  <input type="number" value="1" min="1" max="10" class="qty-input">
                  <button class="qty-btn">+</button>
                </div>
                <button class="btn-remove">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                  Hapus
                </button>
              </div>
            </div>
            <div class="cart-item-price">
              Rp1.850.000
            </div>
          </div>

          <div class="cart-item">
            <div class="cart-item-image">
              <img src="https://images.unsplash.com/photo-1615663245857-ac93bb5c9023?ixlib=rb-4.0.3&auto=format&fit=crop&w=300&q=80" alt="Mouse">
            </div>
            <div class="cart-item-info">
              <span class="product-cat">Control</span>
              <a href="product-detail.html"><h3>Logitech G Pro X Superlight</h3></a>
              <p>Hitam</p>
              <div class="cart-item-actions">
                <div class="quantity-selector">
                  <button class="qty-btn">-</button>
                  <input type="number" value="1" min="1" max="10" class="qty-input">
                  <button class="qty-btn">+</button>
                </div>
                <button class="btn-remove">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                  Hapus
                </button>
              </div>
            </div>
            <div class="cart-item-price">
              Rp2.150.000
            </div>
          </div>

        </div>

        <!-- CART SUMMARY -->
        <aside class="cart-summary">
          <h3>Ringkasan Pesanan</h3>
          <div class="summary-row">
            <span>Subtotal (2 Item)</span>
            <span>Rp4.000.000</span>
          </div>
          <div class="summary-row">
            <span>Estimasi Ongkir</span>
            <span>Rp20.000</span>
          </div>
          <div class="summary-divider"></div>
          <div class="summary-row total">
            <span>Total Bayar</span>
            <span class="text-accent">Rp4.020.000</span>
          </div>
          <a href="checkout.html" class="btn btn-primary w-100" style="margin-top: 20px;">Lanjut ke Checkout</a>
          <a href="catalog.html" class="btn btn-outline w-100" style="margin-top: 10px;">Lanjut Belanja</a>
        </aside>
      </div>

    </div>
  </main>
            <!-- GLOBAL FOOTER COMPONENT -->
    <div id="global-footer"></div>

    <!-- Search Drawer Overlay -->
  <div id="search-drawer" class="drawer">
    <div class="drawer-content" style="background:#181824; padding:30px; text-align:center;">
      <h3>Cari Gear</h3>
      <input type="text" class="form-input" placeholder="Ketik nama produk..." style="margin:20px 0;">
      <button class="btn btn-primary" onclick="document.getElementById('search-drawer').classList.remove('active')">Tutup</button>
    </div>
  </div>

  <script src="scripts/global-components.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
