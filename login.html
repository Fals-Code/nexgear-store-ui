<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXGEAR - Access</title>

    <script>
      (function () {
        try {
          if (
            sessionStorage.getItem("nexgear-page-transition-mode") === "login"
          ) {
            document.documentElement.classList.add("pt-preload-open");
          }
        } catch (error) {}
      })();
    </script>

    <link rel="stylesheet" href="styles/login.css" />
    <link rel="stylesheet" href="styles/login-floating-label.css" />
    <link rel="stylesheet" href="styles/transition.css" />
  </head>

  <body>
    <div class="page-transition" aria-hidden="true">
      <span class="page-transition__panel page-transition__panel--a"></span>
      <span class="page-transition__panel page-transition__panel--b"></span>
      <span class="page-transition__panel page-transition__panel--c"></span>
      <span class="page-transition__panel page-transition__panel--d"></span>
      <span class="page-transition__brand">NEXGEAR</span>
    </div>

    <main class="login-page" aria-label="NEXGEAR access page">
      <div class="container" id="container">
        <input class="auth-checkbox" type="checkbox" id="auth-register" />
        <input class="reg-checkbox" type="checkbox" id="reg-progress2" />
        <input class="reg-checkbox" type="checkbox" id="reg-progress3" />
        <input class="reg-checkbox" type="checkbox" id="reg-finish" />

        <div class="register-stage" aria-hidden="true"></div>
        <div class="register-progress" aria-hidden="true"></div>

        <div class="top" aria-hidden="true"></div>
        <div class="bottom" aria-hidden="true"></div>

        <section class="center" aria-labelledby="access-title">
          <h1 id="access-title" class="sr-only">NEXGEAR access page</h1>

          <div class="brand">
            <div class="brand-name">NEXGEAR</div>
          </div>

          <div class="auth-panels">
            <form class="login-form auth-panel login-panel" action="profile.html" method="get" data-transition-href="profile.html">
              <div class="field">
                <label class="sr-only" for="email">Email address</label>
                <input
                  id="email"
                  type="email"
                  placeholder="Email address"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="field password-field">
                <label class="sr-only" for="password">Password</label>
                <input
                  id="password"
                  type="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                />
              </div>

              <span class="forgot-link is-disabled" aria-disabled="true">
                Forgot password?
              </span>

              <button class="btn-auth" type="submit">Sign In</button>

              <label class="btn-auth btn-secondary" for="auth-register">
                Create Account
              </label>

              <a
                href="index.html"
                class="back-center-btn"
                aria-label="Back to home"
              >
                <span>Back</span>
              </a>
            </form>

            <div class="auth-panel register-panel">
              <div class="register-welcome">
                <strong>Welcome aboard!</strong>
                <span>Your NEXGEAR access is ready.</span>
              </div>

              <form class="register-form" action="profile.html" method="get">
                <div class="register-group register-step-1">
                  <label class="register-field" for="username">
                    <input
                      type="text"
                      id="username"
                      class="register-input"
                      placeholder=" "
                      pattern="[^\s]+"
                      autocomplete="username"
                      required
                    />

                    <span class="register-label">Create your username.</span>
                    <b class="register-border" aria-hidden="true"></b>
                  </label>

                  <label
                    class="register-next"
                    for="reg-progress2"
                    role="button"
                    aria-label="Next step"
                  >
                    <span class="register-next-icon" aria-hidden="true"></span>
                  </label>
                </div>

                <div class="register-group register-step-2">
                  <label class="register-field" for="register-email">
                    <input
                      type="email"
                      id="register-email"
                      class="register-input"
                      placeholder=" "
                      autocomplete="email"
                      required
                    />

                    <span class="register-label">What's your email?</span>
                    <b class="register-border" aria-hidden="true"></b>
                  </label>

                  <label
                    class="register-next"
                    for="reg-progress3"
                    role="button"
                    aria-label="Next step"
                  >
                    <span class="register-next-icon" aria-hidden="true"></span>
                  </label>
                </div>

                <div class="register-group register-step-3">
                  <label class="register-field" for="register-password">
                    <input
                      type="password"
                      id="register-password"
                      class="register-input"
                      placeholder=" "
                      autocomplete="new-password"
                      minlength="6"
                      required
                    />

                    <span class="register-label">Create your password.</span>
                    <b class="register-border" aria-hidden="true"></b>
                  </label>
                  <button
                    class="register-next register-submit"
                    type="submit"
                    aria-label="Finish registration"
                  >
                    <span class="register-next-icon" aria-hidden="true"></span>
                  </button>
                </div>
              </form>

              <label class="register-back" for="auth-register">
                Back to Sign In
              </label>
            </div>
          </div>
        </section>

        <p class="login-hint" aria-hidden="true">
          Hover / tap to reveal access
        </p>
      </div>
    </main>

    <script>
      (function () {
        const authRegister = document.getElementById("auth-register");
        const progress2 = document.getElementById("reg-progress2");
        const progress3 = document.getElementById("reg-progress3");
        const finish = document.getElementById("reg-finish");

        function resetRegisterSteps() {
          progress2.checked = false;
          progress3.checked = false;
          finish.checked = false;
        }

        authRegister.addEventListener("change", resetRegisterSteps);
      })();
    </script>

    <script src="scripts/login-customer.js?v=1"></script>
    <script src="scripts/page-transition.js"></script>
  </body>
</html>
