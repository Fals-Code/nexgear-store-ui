<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXGEAR — Sign In</title>
    <link rel="stylesheet" href="styles/login.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="top"></div>
      <div class="bottom"></div>

      <div class="center">
        <div class="brand">
          <div class="brand-name">NEXGEAR</div>
          <div class="brand-sub">Premium Gaming Store</div>
        </div>

        <span class="form-heading">Access Your Account</span>

        <div class="field">
          <input
            type="email"
            placeholder="Email address"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <input
            type="password"
            placeholder="Password"
            autocomplete="current-password"
          />
        </div>

        <button class="btn-signin" type="button">Sign In</button>

        <p class="form-footer">
          No account? <a href="#">Create one</a> &nbsp;·&nbsp;
          <a href="#">Forgot password</a>
        </p>
      </div>
    </div>
  </body>
</html>
