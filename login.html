<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Masuk atau daftar ke akun NEXGEAR untuk pengalaman belanja gaming gear yang lebih personal.">
  <title>Masuk | NEXGEAR</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>
  <main class="login-wrapper">
    <a href="index.html" class="btn btn-outline" style="position: absolute; top: 32px; left: 32px; z-index: 10; font-size: 0.9rem; padding: 8px 16px;">
      <span class="icon icon-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></span> Kembali
    </a>
    <div class="login-bg-deco">
      <svg width="100%" height="100%" style="position:absolute;top:0;left:0;">
        <path d="M-50,100 Q150,50 350,150 T750,100 T1150,150" stroke="rgba(255,255,255,0.05)" fill="none" stroke-width="2" stroke-dasharray="10 5" />
        <path d="M-50,300 Q200,400 400,250 T800,350 T1200,250" stroke="rgba(0,210,255,0.05)" fill="none" stroke-width="2" stroke-dasharray="10 5" />
        <circle cx="10%" cy="20%" r="40" stroke="rgba(255,255,255,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" />
        <circle cx="85%" cy="80%" r="60" stroke="rgba(157,80,187,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" />
        <rect x="80%" y="15%" width="80" height="80" rx="10" stroke="rgba(0,210,255,0.03)" fill="none" stroke-width="2" stroke-dasharray="5 5" transform="rotate(15 80% 15%)" />
      </svg>
    </div>

    <div class="login-card sketch-card tape-corner reveal">
      <div class="login-avatar">
        <span class="icon icon-xl">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="2 1"/>
            <path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke="currentColor" fill="none" stroke-width="1.5" stroke-dasharray="4 2"/>
            <circle cx="10" cy="7" r="1" fill="currentColor"/>
            <circle cx="14" cy="7" r="1" fill="currentColor"/>
            <path d="M10 10 Q12 11 14 10" stroke="currentColor" fill="none" stroke-width="1"/>
          </svg>
        </span>
      </div>
      <h2>Selamat Datang</h2>
      <div class="subtitle">masuk ke akun NEXGEAR-mu~</div>

      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
          <input type="email" class="notepad-input" placeholder="Email" required>
        </div>
        <div class="form-group">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" class="notepad-input" placeholder="Password" required>
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox"> Ingat Saya
          </label>
          <a href="#" class="forgot-link">Lupa password?</a>
        </div>
        <button type="submit" class="btn btn-primary auth-btn">Masuk</button>
        
        <div class="auth-divider">atau</div>
        
        <button type="button" class="btn btn-outline google-btn" onclick="showToast('Fitur login Google akan segera hadir!')" style="margin-bottom: 20px;">
          <span class="icon icon-sm"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg></span>
          Masuk dengan Google
        </button>

        <p style="font-size: 0.9rem; color: var(--text-muted); text-align: center;">
          Belum punya akun? <a href="register.html" class="forgot-link">Daftar di sini</a>
        </p>
      </form>

    </div>
  </main>

  <script src="scripts/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Berhasil masuk! Selamat datang kembali.');
      setTimeout(() => window.location.href = 'index.html', 1500);
    });
  </script>
</body>
</html>
