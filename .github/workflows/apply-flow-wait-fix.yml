name: Apply flow wait fix

on:
  push:
    branches:
      - quality/uas-rubric-hardening
    paths:
      - tools/apply_flow_wait_fix.py
      - .github/workflows/apply-flow-wait-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[flow-wait-fix]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: quality/uas-rubric-hardening
          fetch-depth: 0

      - name: Apply wait fix
        run: python3 tools/apply_flow_wait_fix.py

      - name: Validate browser test source
        run: node --check tools/visual_smoke.mjs

      - name: Commit repaired test
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No flow wait changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual_smoke.mjs
          git commit -m "[flow-wait-fix] Wait for recovery navigation at DOM readiness"
          git push origin HEAD:quality/uas-rubric-hardening
