name: Apply visual smoke fixes

on:
  push:
    branches:
      - quality/uas-rubric-hardening
    paths:
      - tools/apply_visual_smoke_fixes.py
      - .github/workflows/apply-visual-smoke-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[visual-smoke-fix]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: quality/uas-rubric-hardening
          fetch-depth: 0

      - name: Apply visual smoke repairs
        run: python3 tools/apply_visual_smoke_fixes.py

      - name: Validate repaired JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/admin-suite.js
          node --check scripts/quality-hardening.js
          node --check tools/visual_smoke.mjs

      - name: Validate project source
        run: python3 tools/validate_uas_project.py

      - name: Commit repaired source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No visual smoke repairs detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/admin-suite.js scripts/quality-hardening.js styles/checkout.css tools/visual_smoke.mjs
          git commit -m "[visual-smoke-fix] Repair cart, admin quality layer, media fallback, and checkout consent"
          git push origin HEAD:quality/uas-rubric-hardening
