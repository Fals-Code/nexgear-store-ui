name: Apply recovery CTA test fix

on:
  push:
    branches:
      - quality/uas-rubric-hardening
    paths:
      - tools/apply_recovery_cta_test_fix.py
      - .github/workflows/apply-recovery-cta-test-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[recovery-cta-test-fix]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: quality/uas-rubric-hardening
          fetch-depth: 0

      - name: Apply recovery CTA test fix
        run: python3 tools/apply_recovery_cta_test_fix.py

      - name: Validate browser test source
        run: node --check tools/visual_smoke.mjs

      - name: Commit test fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No recovery CTA test changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual_smoke.mjs
          git commit -m "[recovery-cta-test-fix] Verify visible paid recovery CTA"
          git push origin HEAD:quality/uas-rubric-hardening
