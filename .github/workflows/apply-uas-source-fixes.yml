name: Apply UAS source fixes

on:
  push:
    branches:
      - quality/uas-rubric-hardening
    paths:
      - tools/apply_uas_source_fixes.py
      - assets/hero-poster.svg
      - .github/workflows/apply-uas-source-fixes.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[uas-source-fix]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: quality/uas-rubric-hardening
          fetch-depth: 0

      - name: Apply source fixes
        run: python3 tools/apply_uas_source_fixes.py

      - name: Validate repaired source
        run: python3 tools/validate_uas_project.py

      - name: Commit repaired pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source repair changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html login.html
          git commit -m "[uas-source-fix] Repair poster asset and document language"
          git push origin HEAD:quality/uas-rubric-hardening
