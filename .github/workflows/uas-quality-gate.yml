name: UAS quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)

      - name: Validate UAS pages and local references
        run: python3 tools/validate_uas_project.py

      - name: Report source footprint
        shell: bash
        run: |
          echo "HTML pages: $(find . -maxdepth 1 -type f -name '*.html' | wc -l)"
          echo "JavaScript files: $(find scripts -type f -name '*.js' | wc -l)"
          echo "CSS files: $(find styles -type f -name '*.css' | wc -l)"
