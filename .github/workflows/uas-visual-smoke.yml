name: UAS visual smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.53.1
          npx playwright install --with-deps chromium

      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 5500 --bind 127.0.0.1 > /tmp/nexgear-server.log 2>&1 &
          echo $! > /tmp/nexgear-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5500/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexgear-server.log
          exit 1

      - name: Run responsive and flow smoke test
        env:
          BASE_URL: http://127.0.0.1:5500
        run: node tools/visual_smoke.mjs

      - name: Run admin CRUD feedback smoke test
        env:
          BASE_URL: http://127.0.0.1:5500
        run: node tools/admin_feedback_smoke.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uas-visual-smoke-report
          path: artifacts/uas-visual-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Print local server log
        if: failure()
        run: cat /tmp/nexgear-server.log || true
